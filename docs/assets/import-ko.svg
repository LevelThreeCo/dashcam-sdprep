    <text x="28" y="134" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">? </tspan><tspan fill="#f8fafc" font-weight="700">가져오기를 시작할까요? </tspan><tspan fill="#22d3ee">Yes</tspan></text>
    <text x="28" y="159" xml:space="preserve"><tspan fill="#64748b">[1/28] </tspan><tspan fill="#4ade80">가져옴  </tspan><tspan fill="#e2e8f0">2025-03-15_08-02-11_REC1.avi</tspan></text>
    <text x="28" y="184" xml:space="preserve"><tspan fill="#64748b">[2/28] </tspan><tspan fill="#4ade80">가져옴  </tspan><tspan fill="#e2e8f0">2025-03-15_08-03-27_REC1.avi</tspan></text>
    <text x="28" y="209" xml:space="preserve"><tspan fill="#64748b">[3/28] </tspan><tspan fill="#4ade80">가져옴  </tspan><tspan fill="#e2e8f0">2025-03-15_08-04-55_EVT1.avi</tspan></text>
    <text x="28" y="234" xml:space="preserve"><tspan fill="#64748b">   ...</tspan></text>
