<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">dashcam-sdprep</title>
  <desc id="desc">Format SD cards the way your dashcam expects, and import footage with the real time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- Dashcam -->
  <g transform="translate(80 92)">
    <rect x="0" y="0" width="400" height="216" rx="22" fill="#0a0f1a" stroke="#334155" stroke-width="2"/>
    <rect x="22" y="20" width="356" height="176" rx="10" fill="url(#screen)" stroke="#1f2a3d"/>
    <circle cx="44" cy="44" r="6" fill="#ef4444"/>
    <text x="58" y="49" class="mono" font-size="14" font-weight="700" fill="#ef4444">REC</text>
    <text x="356" y="49" class="mono" font-size="14" fill="#64748b" text-anchor="end">14.6V</text>
    <text x="44" y="98" class="mono" font-size="15" fill="#64748b">camera clock</text>
    <text x="44" y="124" class="mono" font-size="22" fill="#94a3b8" text-decoration="line-through">2025/03/01 08:12:05</text>
    <text x="44" y="158" class="mono" font-size="15" fill="#64748b">real time</text>
    <text x="44" y="184" class="mono" font-size="22" font-weight="700" fill="#4ade80">2025/03/15 17:30:41</text>
    <rect x="-10" y="70" width="10" height="56" rx="3" fill="#1f2937"/>
  </g>

  <!-- SD card -->
  <g transform="translate(436 214)">
    <path d="M18 0 H112 a10 10 0 0 1 10 10 V138 a10 10 0 0 1 -10 10 H10 a10 10 0 0 1 -10 -10 V18 Z" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <g fill="#facc15" opacity="0.9">
      <rect x="24" y="10" width="10" height="24" rx="2"/><rect x="42" y="10" width="10" height="24" rx="2"/>
      <rect x="60" y="10" width="10" height="24" rx="2"/><rect x="78" y="10" width="10" height="24" rx="2"/>
      <rect x="96" y="10" width="10" height="24" rx="2"/>
    </g>
    <text x="61" y="84" class="mono" font-size="18" font-weight="700" fill="#e0e7ff" text-anchor="middle">FAT32</text>
    <text x="61" y="108" class="mono" font-size="14" fill="#93c5fd" text-anchor="middle">64 KiB</text>
    <text x="61" y="126" class="mono" font-size="12" fill="#93c5fd" text-anchor="middle">clusters</text>
  </g>

  <!-- Title -->
  <g transform="translate(640 0)">
    <text x="0" y="150" class="mono" font-size="56" font-weight="800" fill="#f8fafc">dashcam-sdprep</text>
    <text x="2" y="200" class="sans" font-size="23" fill="#cbd5e1">Format SD cards the way your dashcam expects.</text>
    <text x="2" y="232" class="sans" font-size="23" fill="#cbd5e1">Import footage with the real date and time.</text>
    <text x="2" y="274" class="sans" font-size="19" fill="#94a3b8">블랙박스에 맞게 SD 카드를 포맷하고, 실제 시각으로 영상을 가져옵니다.</text>
    <g class="sans" font-size="15" font-weight="600">
      <rect x="0" y="304" width="78" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="39" y="325" fill="#e2e8f0" text-anchor="middle">macOS</text>
      <rect x="90" y="304" width="70" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="125" y="325" fill="#e2e8f0" text-anchor="middle">Linux</text>
      <rect x="172" y="304" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="247" y="325" fill="#e2e8f0" text-anchor="middle">English · 한국어</text>
      <rect x="334" y="304" width="62" height="32" rx="16" fill="#14532d" stroke="#166534"/>
      <text x="365" y="325" fill="#bbf7d0" text-anchor="middle">MIT</text>
    </g>
  </g>
</svg>
