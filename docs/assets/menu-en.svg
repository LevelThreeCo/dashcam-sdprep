<svg xmlns="http://www.w3.org/2000/svg" width="980" height="421" viewBox="0 0 980 421" role="img" aria-label="dashcam-sdprep">
  <rect width="980" height="421" rx="14" fill="#0b1220" stroke="#1f2a3d"/>
  <rect width="980" height="40" rx="14" fill="#111a2e"/>
  <rect y="26" width="980" height="14" fill="#111a2e"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f57"/><circle cx="46" cy="20" r="6.5" fill="#febc2e"/><circle cx="68" cy="20" r="6.5" fill="#28c840"/>
  <text x="490" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', monospace" font-size="13" fill="#64748b">dashcam-sdprep</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', monospace" font-size="15">
    <text x="28" y="84" xml:space="preserve"><tspan fill="#64748b">dashcam-sdprep 0.2.0</tspan></text>
    <text x="28" y="109" xml:space="preserve"></text>
    <text x="28" y="134" xml:space="preserve"><tspan fill="#94a3b8">Camera:</tspan></text>
    <text x="160" y="134" xml:space="preserve"><tspan fill="#e2e8f0">Vugera VG-701V3</tspan></text>
    <text x="28" y="159" xml:space="preserve"><tspan fill="#94a3b8">Import to:</tspan></text>
    <text x="160" y="159" xml:space="preserve"><tspan fill="#e2e8f0">~/Downloads/Dashcam</tspan></text>
    <text x="28" y="184" xml:space="preserve"><tspan fill="#94a3b8">Time zone:</tspan></text>
    <text x="160" y="184" xml:space="preserve"><tspan fill="#e2e8f0">America/Toronto (EST)</tspan></text>
    <text x="28" y="209" xml:space="preserve"><tspan fill="#94a3b8">Camera clock:</tspan></text>
    <text x="160" y="209" xml:space="preserve"><tspan fill="#fbbf24">14 d 9 h 18 m 36 s behind real time</tspan><tspan fill="#64748b"> (calibrated 2025-03-15 17:30)</tspan></text>
    <text x="28" y="234" xml:space="preserve"></text>
    <text x="28" y="259" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">? </tspan><tspan fill="#f8fafc" font-weight="700">What would you like to do? </tspan><tspan fill="#64748b">(Up/Down to move, Enter to choose, Esc to go back)</tspan></text>
    <text x="28" y="284" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700"> » Import videos from the SD card</tspan></text>
    <text x="28" y="309" xml:space="preserve"><tspan fill="#e2e8f0">   Calibrate the camera clock</tspan></text>
    <text x="28" y="334" xml:space="preserve"><tspan fill="#e2e8f0">   Prepare (format) an SD card</tspan></text>
    <text x="28" y="359" xml:space="preserve"><tspan fill="#e2e8f0">   Settings</tspan></text>
    <text x="28" y="384" xml:space="preserve"><tspan fill="#e2e8f0">   Quit</tspan></text>
  </g>
